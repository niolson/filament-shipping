services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        APT_CACHE_BUST: ${APT_CACHE_BUST:-1}
    restart: unless-stopped
    env_file:
      - path: /opt/shared/shared-secrets.env
        required: false
    environment:
      QZ_PRIVATE_KEY_PATH: ./storage/app/private/qz-private-key.pem
      QZ_CERTIFICATE_PATH: ./public/qz-certificate.pem
    volumes:
      - ./.env:/var/www/html/.env
      - ${QZ_PRIVATE_KEY_PATH:-./storage/app/private/qz-private-key.pem}:/var/www/html/storage/app/private/qz-private-key.pem:ro
      - ${QZ_CERTIFICATE_PATH:-./public/qz-certificate.pem}:/var/www/html/public/qz-certificate.pem:ro
      - ./storage/app/private/ssh:/var/www/html/storage/app/private/ssh
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    networks:
      - default
      - shared
    healthcheck:
      test: ["CMD-SHELL", "php artisan --version > /dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    restart: unless-stopped
    volumes:
      - ${QZ_CERTIFICATE_PATH:-./public/qz-certificate.pem}:/var/www/html/public/qz-certificate.pem:ro
    networks:
      - default
      - proxy
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Prepares the keyring volume before MySQL starts. Without this a fresh
  # install cannot bring up encryption at rest at all: the mysql image's
  # entrypoint runs `mysqld --verbose --help` as root before dropping to the
  # mysql user, which loads the keyring component and creates the key file
  # owned by root. The real mysqld then cannot read it, reports "Failed to
  # read keyring file", and aborts in a restart loop.
  #
  # Pre-creating the file as the mysql user avoids that. It never deletes or
  # truncates an existing keyring — losing it makes encrypted data
  # unrecoverable — it only creates the file when absent and fixes ownership.
  mysql-keyring-init:
    image: mysql:8.4@sha256:77e7fd3d377ad2d9e7983d457b71ff8a04c0f19e41948d722f15c508a48dcce3
    profiles: [standalone]
    restart: "no"
    user: root
    volumes:
      - mysql-keyring:/var/lib/mysql-keyring
    command:
      - sh
      - -c
      - |
        set -e
        DIR=/var/lib/mysql-keyring
        KEYFILE=$$DIR/component_keyring_file
        LEGACY=$$DIR/keyring

        # Refuse to start an upgrade that would make encrypted tables
        # unreadable. A non-empty plugin-era keyring with no component keyring
        # beside it means the keys still live in the old keystore; starting
        # would bring MySQL up against an empty component keyring, unable to
        # decrypt anything. The migration cannot be done from here either —
        # keyring_file.so does not exist in 8.4 — so it must happen on the
        # older MySQL first. See docs/server-setup.md.
        if [ -s "$$LEGACY" ] && [ ! -s "$$KEYFILE" ]; then
          echo "ERROR: legacy plugin keyring $$LEGACY holds keys but the component" >&2
          echo "keyring $$KEYFILE is empty. Encrypted tables would be unreadable." >&2
          echo "Run mysql_migrate_keyring on MySQL 8.0 BEFORE upgrading to 8.4 —" >&2
          echo "see the keyring migration section of docs/server-setup.md." >&2
          exit 1
        fi

        if [ ! -e "$$KEYFILE" ]; then
          install -o 999 -g 999 -m 640 /dev/null "$$KEYFILE"
        fi
        chown 999:999 "$$DIR" "$$KEYFILE"

  mysql:
    image: mysql:8.4@sha256:77e7fd3d377ad2d9e7983d457b71ff8a04c0f19e41948d722f15c508a48dcce3
    restart: unless-stopped
    profiles: [standalone]
    depends_on:
      mysql-keyring-init:
        condition: service_completed_successfully
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-keyring:/var/lib/mysql-keyring
      # All three are required together: mysql.cnf turns encryption on, while
      # mysqld.my and component_keyring_file.cnf activate and configure the
      # keyring component that supplies the keys. Mounting mysql.cnf alone
      # leaves 8.4 with encryption enabled and no keyring to encrypt with.
      # Shared by the shared-server deployment — see infra/README.md.
      - ./infra/shared/mysql.cnf:/etc/mysql/conf.d/encryption.cnf:ro
      - ./infra/shared/mysqld.my:/usr/sbin/mysqld.my:ro
      - ./infra/shared/component_keyring_file.cnf:/usr/lib64/mysql/plugin/component_keyring_file.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine@sha256:883c7c980a2ff698f71c95cada99f968a54483ce5baad707b65877cfe0c98f1c
    restart: unless-stopped
    profiles: [standalone]
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        APT_CACHE_BUST: ${APT_CACHE_BUST:-1}
    restart: unless-stopped
    env_file:
      - path: /opt/shared/shared-secrets.env
        required: false
    volumes:
      - ./.env:/var/www/html/.env
    entrypoint: ["sh", "-c", "php artisan config:cache && php artisan queue:work --queue=default,low --tries=3"]
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    networks:
      - default
      - shared

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        APT_CACHE_BUST: ${APT_CACHE_BUST:-1}
    restart: unless-stopped
    env_file:
      - path: /opt/shared/shared-secrets.env
        required: false
    volumes:
      - ./.env:/var/www/html/.env
    entrypoint: ["sh", "-c", "php artisan config:cache && php artisan schedule:work"]
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    networks:
      - default
      - shared

volumes:
  mysql-data:
  mysql-keyring:
  redis-data:

networks:
  proxy:
    external: true
  shared:
    external: true
    # Per-tenant isolation: in shared mode each tenant joins its own
    # `shared-<tenant>` network (the shared datastores are attached to all of
    # them), so tenants can reach MySQL/Redis/Gotenberg but not each other.
    # Defaults to the flat `shared` network for standalone/on-prem. See issue 16.
    name: ${SHARED_NETWORK:-shared}
