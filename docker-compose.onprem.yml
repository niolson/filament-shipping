# On-premise override — publishes nginx ports directly (no Caddy)
#
# Usage:
#   docker compose --profile standalone -f docker-compose.yml -f docker-compose.onprem.yml up -d

services:
  nginx:
    ports:
      - "${APP_PORT:-80}:80"

  gotenberg:
    image: gotenberg/gotenberg:8@sha256:67097317623a503ba2a6a7e9ae8db6929a1f7e1bbd88077bacf2d325fbdab923
    restart: unless-stopped
