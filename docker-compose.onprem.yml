# On-premise override — publishes nginx ports directly (no Caddy)
#
# Usage:
#   docker compose --profile standalone -f docker-compose.yml -f docker-compose.onprem.yml up -d

services:
  nginx:
    ports:
      - "${APP_PORT:-80}:80"

  gotenberg:
    image: gotenberg/gotenberg:8@sha256:87c16b9f364279d321bc9772d31fa58aa6abe036423c270698bd636c3a8e9466
    restart: unless-stopped
