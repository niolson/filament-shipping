name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, zip, gd, intl, bcmath, pcntl
          coverage: pcov

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      # Paratest, one process per core. See the "Testing" section of AGENTS.md
      # for why workers must not share state.
      - name: Run tests
        run: composer run test:ci
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-clover
          path: coverage.xml
          if-no-files-found: warn

  static:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # No coverage driver: pcov costs startup time and nothing here measures
      # coverage.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, zip, gd, intl, bcmath, pcntl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      # Larastan boots the application container, so it needs an APP_KEY.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: vendor/bin/pint --test

      # Dependency advisories are deliberately not gated here. The
      # security-audit workflow runs composer and npm audit on every push and
      # pull request across all branches, at the same --audit-level=high the
      # pre-push hook uses. Duplicating them in the merge gate meant an
      # overnight upstream advisory could block an unrelated branch.
      - name: Run static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  browser:
    name: Browser Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, zip, gd, intl, bcmath, pcntl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Not parallelised: the browser suite is a handful of tests and each one
      # drives a real Chromium.
      - name: Run browser tests
        run: php artisan test tests/Browser/
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Get cache rotation keys
        id: date
        run: |
          echo "week=$(date +%Y-%U)" >> $GITHUB_OUTPUT
          echo "day=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Build app image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: app
          tags: polybag-app:ci
          load: true
          push: false
          # Rotates daily so the cached apt-get update/upgrade layer cannot go
          # stale for a whole week. Without it the CVE scan below fails on
          # Debian security patches published mid-week that a fresh build
          # would already have picked up.
          build-args: |
            APT_CACHE_BUST=${{ steps.date.outputs.day }}
          cache-from: type=gha,scope=app-${{ steps.date.outputs.week }}
          cache-to: type=gha,scope=app-${{ steps.date.outputs.week }},mode=max

      - name: Build nginx image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: nginx
          push: false
          cache-from: type=gha,scope=nginx-${{ steps.date.outputs.week }}
          cache-to: type=gha,scope=nginx-${{ steps.date.outputs.week }},mode=max

      - name: Scan app image for CVEs
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6.5.1
        with:
          image: polybag-app:ci
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: table
