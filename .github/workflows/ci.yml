name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, zip, gd, intl, bcmath, pcntl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Audit PHP dependencies
        run: composer audit

      - name: Audit npm dependencies
        run: npm audit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Run browser tests
        run: php artisan test tests/Browser/
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Get week number for cache rotation
        id: date
        run: echo "week=$(date +%Y-%U)" >> $GITHUB_OUTPUT

      - name: Build app image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: app
          tags: polybag-app:ci
          load: true
          push: false
          cache-from: type=gha,scope=app-${{ steps.date.outputs.week }}
          cache-to: type=gha,scope=app-${{ steps.date.outputs.week }},mode=max

      - name: Build nginx image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: nginx
          push: false
          cache-from: type=gha,scope=nginx-${{ steps.date.outputs.week }}
          cache-to: type=gha,scope=nginx-${{ steps.date.outputs.week }},mode=max

      - name: Scan app image for CVEs
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6.5.1
        with:
          image: polybag-app:ci
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: table
