name: Security Audit

on:
  push:
  pull_request:

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Composer audit
        run: composer audit --locked --no-interaction

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: npm audit (high and above)
        run: npm audit --audit-level=high

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Installed via pipx with a pinned version rather than a third-party
      # action, to keep the supply-chain surface to the (immutable) PyPI release.
      - name: Install Semgrep
        run: pipx install semgrep==1.168.0

      # docker/nginx.conf deliberately re-declares all security headers inside
      # the /build/ location (nginx does not inherit add_header into a location
      # that sets its own). The generic header-redefinition rule is a pattern
      # matcher that flags every add_header in a location and cannot recognise
      # that fix, so it is excluded — the rest of p/security-audit still runs.
      - name: Run Semgrep
        run: >
          semgrep scan
          --config p/php
          --config p/javascript
          --config p/security-audit
          --config p/secrets
          --exclude-rule generic.nginx.security.header-redefinition.header-redefinition
          --exclude public/js
          --exclude public/build
          --error
          --skip-unknown-extensions

  hadolint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
