version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "laravel-vite-plugin"
        update-types: ["version-update:semver-major"]

  # Dockerfile base images.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "php"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Compose files. A SEPARATE ecosystem from "docker" above — that one only
  # reads Dockerfiles, so without this every image referenced in a compose file
  # goes unmanaged. Covers the tenant stack at the root and the shared server
  # infrastructure under infra/ (see infra/README.md).
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/infra/shared"
      - "/infra/caddy"
      - "/infra/gotenberg"
      - "/infra/uptime-kuma"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
