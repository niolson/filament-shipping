version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "laravel-vite-plugin"
        update-types: ["version-update:semver-major"]

  # Dockerfile base images.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "php"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Compose files. A SEPARATE ecosystem from "docker" above — that one only
  # reads Dockerfiles, so without this every image referenced in a compose file
  # goes unmanaged. The root directory covers docker-compose.yml and
  # docker-compose.onprem.yml — MySQL, Redis, and Gotenberg. The shared-server
  # compose files that used to be listed here live in the private ops repo and
  # are watched by its own Dependabot config.
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # Stay on the 8.4 LTS series. MySQL moved to calendar versioning after
      # 9.7 (YY.M.P — 26.7 is July 2026), and those calver releases are
      # Innovation releases: each is supported only until the next quarterly
      # one ships. Tracking them would mean re-upgrading the database every
      # quarter, and 8.4 -> 26.7 also skips the 9.7 LTS series, which MySQL
      # does not support for in-place upgrades.
      #
      # This ignores major bumps only, so digest refreshes on the pinned
      # `mysql:8.4` tag still arrive as usual and CVE patches keep flowing.
      # Moving to 9.7 LTS is a staged migration (data dictionary upgrade plus
      # the keyring/encryption steps — see infra/README.md), so it should be a
      # deliberate decision rather than an image-tag bump.
      - dependency-name: "mysql"
        update-types: ["version-update:semver-major"]
