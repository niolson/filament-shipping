# Shared Infrastructure — MySQL + Redis
# Deploy to /opt/shared/ on the server (see infra/README.md)
#
# Usage:
#   cd /opt/shared && docker compose up -d
#
# Images are pinned by digest, not tag. See infra/README.md for why, and for
# how to move a pin forward.

services:
  # Prepares the keyring volume before MySQL starts. Kept in step with the
  # identical service in the root docker-compose.yml (standalone profile) —
  # both deployments hit the same two problems.
  #
  # First, on a fresh volume the mysql image's entrypoint runs
  # `mysqld --verbose --help` as root before dropping to the mysql user, which
  # loads the keyring component and creates the key file owned by root. The
  # real mysqld then cannot read it and aborts in a restart loop.
  #
  # Second, it refuses to start an upgrade that would silently make encrypted
  # tables unreadable. It never deletes or truncates an existing keyring.
  shared-mysql-keyring-init:
    image: mysql:26.7@sha256:66aec17cd21a956029b83f083b813073859e8355dc1a00e55df6ba02f0e32345
    container_name: shared-mysql-keyring-init
    restart: "no"
    user: root
    volumes:
      - mysql-keyring:/var/lib/mysql-keyring
    networks:
      - shared
    command:
      - sh
      - -c
      - |
        set -e
        DIR=/var/lib/mysql-keyring
        KEYFILE=$$DIR/component_keyring_file
        LEGACY=$$DIR/keyring

        # Neither the existence nor the size of the component keyring proves a
        # migration succeeded — a failed migration leaves one behind, and normal
        # startup writes a valid-but-keyless one. So any non-empty legacy
        # keyring blocks startup until a human archives it.
        if [ -s "$$LEGACY" ]; then
          echo "ERROR: legacy plugin keyring $$LEGACY still holds key material." >&2
          echo "Refusing to start: if those keys were never migrated to the keyring" >&2
          echo "component, encrypted tables would be unreadable, and the component" >&2
          echo "keyring's existence does not prove that migration succeeded." >&2
          echo "" >&2
          echo "Migrate on MySQL 8.0, verify you can read encrypted tables, then" >&2
          echo "archive the legacy keyring to acknowledge it:" >&2
          echo "  mv $$LEGACY $$LEGACY.migrated" >&2
          echo "See the keyring migration section of docs/server-setup.md." >&2
          exit 1
        fi

        if [ ! -e "$$KEYFILE" ]; then
          install -o 999 -g 999 -m 640 /dev/null "$$KEYFILE"
        fi
        chown 999:999 "$$DIR" "$$KEYFILE"

  shared-mysql:
    image: mysql:26.7@sha256:66aec17cd21a956029b83f083b813073859e8355dc1a00e55df6ba02f0e32345
    container_name: shared-mysql
    restart: unless-stopped
    depends_on:
      shared-mysql-keyring-init:
        condition: service_completed_successfully
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-keyring:/var/lib/mysql-keyring
      - ./mysql.cnf:/etc/mysql/conf.d/encryption.cnf:ro
      - ./mysqld.my:/usr/sbin/mysqld.my:ro
      - ./component_keyring_file.cnf:/usr/lib64/mysql/plugin/component_keyring_file.cnf:ro
    networks:
      - shared
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  shared-redis:
    image: redis:alpine@sha256:883c7c980a2ff698f71c95cada99f968a54483ce5baad707b65877cfe0c98f1c
    container_name: shared-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - shared
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  mysql-keyring:
  redis-data:

networks:
  shared:
    external: true
