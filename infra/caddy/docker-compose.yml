# Caddy — TLS termination and subdomain routing for every tenant
# Deploy to /opt/caddy/ on the server (see infra/README.md)
#
# Usage:
#   cd /opt/caddy && docker compose up -d
#
# The Caddyfile is NOT tracked here: provision-tenant.sh rewrites it as tenants
# come and go, so the server's copy is the authority for its contents.
#
# Images are pinned by digest, not tag. See infra/README.md for why, and for
# how to move a pin forward. Recreating this container drops all inbound HTTPS
# for every tenant for a few seconds — treat pin bumps as a maintenance window.

services:
  caddy:
    image: caddy:alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/etc/caddy/certs:ro
      - /var/log/caddy:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy

volumes:
  caddy_data:
  caddy_config:

networks:
  proxy:
    external: true
