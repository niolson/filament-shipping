# Uptime Kuma — external monitoring dashboard
# Deploy to /opt/uptime-kuma/ on the server (see infra/README.md)
#
# Usage:
#   cd /opt/uptime-kuma && docker compose up -d
#
# Images are pinned by digest, not tag. See infra/README.md for why, and for
# how to move a pin forward.
#
# Migrated from the `1` tag on 2026-08-04. That tag was last published
# 2025-10-20 on an EOL Debian 10 base and was never going to be updated again —
# the project's work had moved to `2`.
#
# Expect this image to dominate the monthly scan report. v2 bundles Chromium
# for browser-based monitors, which alone accounts for well over a thousand
# critical/high findings whenever it trails the current Chromium release. That
# is not a regression from v1: v1's much lower count was largely an artifact of
# Debian 10 being EOL, so no new advisories were published against it. On the
# application layer v2 is materially better — Node dependency findings dropped
# from 98 to 40 and the bundled cloudflared from 43 to 15.
#
# The v1->v2 migration is ONE-WAY and rewrites heartbeat history in place. If
# this ever needs redoing, back up the data volume first and do not interrupt
# the migration; an interrupted run has to be restored from backup.

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2@sha256:a8610b3b4c38077922ba51b036691e06887d7cefd91fe620fd3d6d23d03dc240
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "extra/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  data:

networks:
  proxy:
    external: true
