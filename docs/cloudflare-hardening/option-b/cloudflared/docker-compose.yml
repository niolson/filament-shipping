# /opt/cloudflared/docker-compose.yml
# Two replicas for HA — cloudflared supports multiple instances of the same
# tunnel, and Cloudflare load-balances across the connections. No published
# ports: the tunnel is outbound-only (that's the whole point).
services:
  cloudflared:
    # Pin to a digest in production, like the caddy/nginx images do.
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml --no-autoupdate run
    volumes:
      - ./config.yml:/etc/cloudflared/config.yml:ro
      - ./<TUNNEL_ID>.json:/etc/cloudflared/<TUNNEL_ID>.json:ro
    networks:
      - proxy
    deploy:
      replicas: 2
      # `docker compose up -d` honors deploy.replicas in Compose v2. If yours
      # doesn't, drop this block and scale with:
      #   docker compose up -d --scale cloudflared=2

networks:
  proxy:
    external: true
