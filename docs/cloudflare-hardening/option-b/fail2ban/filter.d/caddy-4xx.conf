# /etc/fail2ban/filter.d/caddy-4xx.conf
# Matches Caddy JSON access-log lines where a single client_ip racks up
# probing / credential-stuffing responses (401/403/404/429).
#
# client_ip is the REAL visitor because Caddy's trusted_proxies + CF-Connecting-IP
# rewrite it (see Caddyfile.head). Without that, this would ban Cloudflare edge IPs.
[Definition]
failregex = "client_ip":"<HOST>".*?"status":(?:401|403|404|429)\b

# Caddy default JSON logs time as an epoch float in the "ts" field.
datepattern = "ts":{EPOCH}

# VALIDATE before enabling — timestamp parsing is the fiddly, version-sensitive
# bit. Run:
#   fail2ban-regex /var/log/caddy/access.log /etc/fail2ban/filter.d/caddy-4xx.conf
# and confirm it reports matched lines AND a recognised date pattern. If the
# date isn't picked up, set Caddy to log RFC3339 instead and switch datepattern
# to: %Y-%m-%dT%H:%M:%S
